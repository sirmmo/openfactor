<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play OpenFactor</title>
<style>
  :root {
    --ink: #e8e6df; --dim: #9a9c9e; --ground: #15181c; --panel: #1f2329;
    --line: #363c45; --accent: #f2b63c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .bar { position: fixed; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px;
    align-items: center; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #hud { top: calc(12px + env(safe-area-inset-top, 0px)); }
  #tools { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); justify-content: center; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 9px; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .chip b { font-weight: 600; color: var(--ink); }
  .chip span { color: var(--dim); }
  a.chip { color: var(--ink); text-decoration: none; }
  .spacer { flex: 1; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 11px; cursor: pointer; min-height: 40px; }
  button:hover { border-color: var(--dim); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1b1608; font-weight: 600; }
  button kbd { font: 11px var(--mono); opacity: .6; margin-left: 5px; }
  #status { position: fixed; left: 50%; bottom: calc(112px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent);
    border-radius: 6px; padding: 6px 12px; max-width: calc(100% - 32px); }
  @media (max-width: 560px) { button kbd { display: none; } }
</style>
</head>
<body>
<canvas id="view" aria-label="Factory map"></canvas>

<div class="bar" id="hud">
  <a class="chip" href="../">&larr; Docs</a>
  <div class="chip"><span>tick</span> <b id="tick">0</b></div>
  <div class="spacer" id="hud-spacer"></div>
  <div class="chip" title="Hash of the full simulation state"><span>state</span> <b id="hash">-</b></div>
</div>

<div class="bar" id="tools" role="toolbar" aria-label="Build tools"></div>
<div id="status" role="status" hidden></div>

<script>
(async () => {
  const TICK_MS = 1000 / 60;
  const MAX_STEPS_PER_FRAME = 6;
  const TILE_UNITS = 256;
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const DIR_NAMES = ['↑', '→', '↓', '←'];
  // Indices into the Tiny Factory sheet: 12 columns of 16x16 tiles. Units,
  // resources and map layers name their own sprites in the rule pack.
  const SHEET_COLUMNS = 12, SHEET_TILE = 16;
  const FLOOR_SPRITE = 0;
  // Keyed by [has input behind][has output ahead]; the second animation frame
  // is one row down for horizontal belts and one column right for vertical ones.
  const HORIZONTAL_BELTS = [[24, 25], [27, 26]];
  const VERTICAL_BELTS = [[12, 28], [4, 16]];
  const ZOOM_MIN = 32, ZOOM_MAX = 96, ZOOM_STEP = 16;

  const canvas = document.getElementById('view');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const $ = (id) => document.getElementById(id);
  const key = (c) => c.x + ',' + c.y;

  let statusTimer = 0;
  function say(text, ms = 2200) {
    statusEl.textContent = text;
    statusEl.hidden = false;
    clearTimeout(statusTimer);
    if (ms) statusTimer = setTimeout(() => { statusEl.hidden = true; }, ms);
  }

  let of;
  const sheet = new Image();
  try {
    sheet.src = 'assets/tiny-factory.png';
    const [source] = await Promise.all([fetch('openfactor.wasm'), sheet.decode()]);
    if (!source.ok) throw new Error('HTTP ' + source.status);
    const { instance } = await WebAssembly.instantiate(await source.arrayBuffer(), {});
    of = instance.exports;
  } catch (error) {
    say('The game could not load (' + error.message + '). Try reloading the page.', 0);
    return;
  }

  // Calls can grow wasm memory, so take the buffer only after the last call.
  const packPointer = of.of_pack_json(), packLength = of.of_pack_json_len();
  const pack = JSON.parse(new TextDecoder().decode(new Uint8Array(of.memory.buffer, packPointer, packLength)));
  const unitOf = (b) => pack.units[b.kind - 1];
  const digitKey = (index) => (index < 9 ? String(index + 1) : '');
  const TOOLS = [
    { id: 'belt', kind: 0, label: 'Belt', key: digitKey(0) },
    ...pack.units.map((unit, index) => (
      { id: 'unit:' + unit.id, kind: index + 1, label: unit.name, key: digitKey(index + 1) })),
    { id: 'erase', label: 'Erase', key: 'X' },
    { id: 'move', label: 'Move', key: 'M' },
  ];

  const spacer = $('hud-spacer');
  function addCounter(name, id) {
    const chip = document.createElement('div');
    chip.className = 'chip';
    const label = document.createElement('span');
    label.textContent = name.toLowerCase() + ' ';
    const value = document.createElement('b');
    value.id = id;
    value.textContent = '0';
    chip.append(label, value);
    spacer.before(chip);
  }
  pack.resources.forEach((resource, index) => addCounter(resource.name, 'made' + index));
  pack.metrics.forEach((metric, index) => addCounter(metric.name, 'metric' + index));

  let tool = TOOLS[0];
  let rotation = 1;
  let cam = { x: 11, y: 5, cell: window.innerWidth < 700 ? 32 : 48 };
  let width = 0, height = 0;
  let resources = new Map(), buildings = new Map(), items = [];
  let hover = null, drag = null, pan = null;

  // Toolbar
  const toolbar = $('tools');
  const buttons = new Map();
  for (const t of TOOLS) {
    const b = document.createElement('button');
    b.innerHTML = t.label + '<kbd>' + t.key + '</kbd>';
    b.addEventListener('click', () => selectTool(t));
    toolbar.append(b);
    buttons.set(t, b);
  }
  const rotateButton = document.createElement('button');
  rotateButton.addEventListener('click', () => rotate());
  toolbar.append(rotateButton);
  const resetButton = document.createElement('button');
  resetButton.textContent = 'Reset';
  let resetArmed = 0;
  resetButton.addEventListener('click', () => {
    if (resetArmed) {
      clearTimeout(resetArmed); resetArmed = 0;
      resetButton.textContent = 'Reset';
      of.of_reset();
      return;
    }
    resetButton.textContent = 'Really reset?';
    resetArmed = setTimeout(() => { resetArmed = 0; resetButton.textContent = 'Reset'; }, 3000);
  });
  toolbar.append(resetButton);

  function selectTool(t) {
    tool = t;
    for (const [other, b] of buttons) b.setAttribute('aria-pressed', other === t);
  }
  function showRotation() { rotateButton.innerHTML = 'Facing ' + DIR_NAMES[rotation] + '<kbd>R</kbd>'; }
  function rotate() { rotation = (rotation + 1) % 4; showRotation(); }
  selectTool(tool);
  showRotation();

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize);
  resize();

  const cellAt = (e) => ({
    x: Math.floor(cam.x + (e.clientX - width / 2) / cam.cell),
    y: Math.floor(cam.y + (e.clientY - height / 2) / cam.cell),
  });

  function applyAt(cell) {
    const k = key(cell);
    if (drag.touched.has(k)) return;
    const occupied = buildings.has(k);
    if (tool.id === 'erase') {
      if (occupied) { of.of_remove(cell.x, cell.y); drag.touched.add(k); }
    } else if (!occupied) {
      of.of_place(cell.x, cell.y, rotation, tool.kind);
      drag.touched.add(k);
    }
  }

  // Dragging a belt steers it: each laid tile turns to point at the next.
  function dragTo(cell) {
    while (drag.last.x !== cell.x || drag.last.y !== cell.y) {
      const dx = Math.sign(cell.x - drag.last.x), dy = dx ? 0 : Math.sign(cell.y - drag.last.y);
      const next = { x: drag.last.x + dx, y: drag.last.y + dy };
      if (tool.id === 'belt') {
        rotation = DIRS.findIndex(([x, y]) => x === dx && y === dy);
        showRotation();
        if (drag.touched.has(key(drag.last))) {
          of.of_remove(drag.last.x, drag.last.y);
          of.of_place(drag.last.x, drag.last.y, rotation, tool.kind);
        }
      }
      drag.last = next;
      applyAt(next);
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    if (e.button !== 0 || tool.id === 'move') {
      pan = { x: e.clientX, y: e.clientY, camX: cam.x, camY: cam.y };
      return;
    }
    const cell = cellAt(e);
    drag = { last: cell, touched: new Set() };
    applyAt(cell);
  });
  canvas.addEventListener('pointermove', (e) => {
    hover = cellAt(e);
    if (pan) {
      cam.x = pan.camX - (e.clientX - pan.x) / cam.cell;
      cam.y = pan.camY - (e.clientY - pan.y) / cam.cell;
    } else if (drag) {
      dragTo(hover);
    }
  });
  const endPointer = () => { drag = null; pan = null; };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', () => { hover = null; });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const step = e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP;
    cam.cell = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, cam.cell + step));
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    const lower = e.key.toLowerCase();
    if (lower === 'r') return rotate();
    const t = TOOLS.find((x) => x.key.toLowerCase() === lower);
    if (t) return selectTool(t);
    const panStep = 2;
    const moves = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
    if (moves[lower]) {
      e.preventDefault();
      cam.x += moves[lower][0] * panStep;
      cam.y += moves[lower][1] * panStep;
    }
  });

  function readSnapshot() {
    const pointer = of.of_snapshot(), length = of.of_snapshot_len();
    const data = new Int32Array(of.memory.buffer, pointer, length);
    let i = 0;
    resources = new Map();
    for (let n = data[i++]; n > 0; n--, i += 3) resources.set(data[i] + ',' + data[i + 1], data[i + 2]);
    buildings = new Map();
    for (let n = data[i++]; n > 0; n--, i += 4) {
      buildings.set(data[i] + ',' + data[i + 1], { x: data[i], y: data[i + 1], dir: data[i + 2], kind: data[i + 3] });
    }
    items = [];
    for (let n = data[i++]; n > 0; n--, i += 5) {
      const along = data[i + 3] / TILE_UNITS - 0.5, [dx, dy] = DIRS[data[i + 2]];
      items.push({ x: data[i] + 0.5 + dx * along, y: data[i + 1] + 0.5 + dy * along, item: data[i + 4] });
    }
  }

  // Whole pixels only: fractional positions leave seams between tiles.
  const sx = (x) => Math.round((x - cam.x) * cam.cell + width / 2);
  const sy = (y) => Math.round((y - cam.y) * cam.cell + height / 2);

  function drawSprite(index, x, y, size, flipX = false, flipY = false) {
    const srcX = (index % SHEET_COLUMNS) * SHEET_TILE;
    const srcY = Math.floor(index / SHEET_COLUMNS) * SHEET_TILE;
    ctx.save();
    ctx.translate(x + (flipX ? size : 0), y + (flipY ? size : 0));
    ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
    ctx.drawImage(sheet, srcX, srcY, SHEET_TILE, SHEET_TILE, 0, 0, size, size);
    ctx.restore();
  }

  const buildingAt = (x, y) => buildings.get(x + ',' + y);

  function beltHasOutput(b) {
    const [dx, dy] = DIRS[b.dir];
    const front = buildingAt(b.x + dx, b.y + dy);
    if (!front) return false;
    return front.kind === 0 ? front.dir !== (b.dir + 2) % 4 : unitOf(front).accepts;
  }

  function beltHasInput(b) {
    return DIRS.some(([dx, dy], side) => {
      if (side === b.dir) return false;
      const neighbour = buildingAt(b.x + dx, b.y + dy);
      if (!neighbour || neighbour.dir !== (side + 2) % 4) return false;
      return neighbour.kind === 0 || unitOf(neighbour).sends;
    });
  }

  function drawBelt(b, tick) {
    const x = sx(b.x), y = sy(b.y), frame = (tick >> 3) & 1;
    const input = beltHasInput(b) ? 1 : 0, output = beltHasOutput(b) ? 1 : 0;
    if (b.dir === 1 || b.dir === 3) {
      drawSprite(HORIZONTAL_BELTS[input][output] + frame * SHEET_COLUMNS, x, y, cam.cell, b.dir === 3);
    } else {
      drawSprite(VERTICAL_BELTS[input][output] + frame, x, y, cam.cell, false, b.dir === 2);
    }
  }

  function drawOutputArrow(b) {
    ctx.save();
    ctx.translate(sx(b.x + 0.5), sy(b.y + 0.5));
    ctx.rotate((b.dir - 1) * Math.PI / 2);
    ctx.scale(cam.cell, cam.cell);
    ctx.beginPath();
    ctx.moveTo(0.3, -0.14); ctx.lineTo(0.48, 0); ctx.lineTo(0.3, 0.14);
    ctx.closePath();
    ctx.fillStyle = '#fff4d6';
    ctx.strokeStyle = '#3b2a3b';
    ctx.lineWidth = 0.04;
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawBuilding(b, tick) {
    if (b.kind === 0) return drawBelt(b, tick);
    const unit = unitOf(b);
    drawSprite(unit.sprite, sx(b.x), sy(b.y), cam.cell);
    if (unit.sends) drawOutputArrow(b);
  }

  function draw() {
    const tick = of.of_tick();

    const left = Math.floor(cam.x - width / 2 / cam.cell) - 1, right = Math.ceil(cam.x + width / 2 / cam.cell) + 1;
    const top = Math.floor(cam.y - height / 2 / cam.cell) - 1, bottom = Math.ceil(cam.y + height / 2 / cam.cell) + 1;
    const visible = (x, y) => x >= left && x <= right && y >= top && y <= bottom;

    for (let x = left; x <= right; x++) {
      for (let y = top; y <= bottom; y++) {
        const layer = resources.get(x + ',' + y);
        const sprites = layer === undefined ? [FLOOR_SPRITE] : pack.layers[layer].sprites;
        drawSprite(sprites[Math.abs(x * 7 + y * 13) % sprites.length], sx(x), sy(y), cam.cell);
      }
    }
    for (const b of buildings.values()) if (visible(b.x, b.y)) drawBuilding(b, tick);
    // Items scale by whole multiples of the art so their pixels stay even.
    const itemSize = SHEET_TILE * Math.floor(cam.cell / 32);
    for (const it of items) {
      if (!visible(it.x, it.y)) continue;
      drawSprite(pack.resources[it.item].sprite, sx(it.x) - itemSize / 2, sy(it.y) - itemSize / 2, itemSize);
    }

    if (hover && !pan && tool.id !== 'move') {
      if (tool.id === 'erase') {
        ctx.fillStyle = 'rgba(224, 82, 82, .4)';
        ctx.fillRect(sx(hover.x), sy(hover.y), cam.cell, cam.cell);
      } else if (!buildings.has(key(hover))) {
        ctx.globalAlpha = 0.5;
        drawBuilding({ x: hover.x, y: hover.y, dir: rotation, kind: tool.kind }, tick);
        ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = 'rgba(255, 255, 255, .8)';
      ctx.lineWidth = 2;
      ctx.strokeRect(sx(hover.x) + 1, sy(hover.y) + 1, cam.cell - 2, cam.cell - 2);
    }
  }

  function updateHud() {
    $('tick').textContent = of.of_tick().toLocaleString('en');
    const count = (n) => (n >>> 0).toLocaleString('en');
    pack.resources.forEach((_, i) => { $('made' + i).textContent = count(of.of_produced(i)); });
    pack.metrics.forEach((_, i) => { $('metric' + i).textContent = count(of.of_metric(i)); });
    const hex = (n) => (n >>> 0).toString(16).padStart(8, '0');
    $('hash').textContent = hex(of.of_hash_hi()) + hex(of.of_hash_lo());
  }

  let previous = performance.now(), accumulated = 0, nextHud = 0;
  function frame(now) {
    accumulated += now - previous;
    previous = now;
    const steps = Math.min(Math.floor(accumulated / TICK_MS), MAX_STEPS_PER_FRAME);
    if (steps > 0) {
      accumulated = steps === MAX_STEPS_PER_FRAME ? 0 : accumulated - steps * TICK_MS;
      if (of.of_step(steps) > 0) say('Can’t build there. Miners need ore, and tiles must be empty.');
    }
    readSnapshot();
    draw();
    if (now >= nextHud) { updateHud(); nextHud = now + 500; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
