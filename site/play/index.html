<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play OpenFactor</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
  :root {
    --ink: #e8e6df; --dim: #9a9c9e; --ground: #15181c; --panel: #1f2329;
    --line: #363c45; --accent: #f2b63c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #view3d { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .bar { position: fixed; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px;
    align-items: center; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #hud { top: calc(12px + env(safe-area-inset-top, 0px)); }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 9px; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .chip b { font-weight: 600; color: var(--ink); }
  .chip span { color: var(--dim); }
  a.chip { color: var(--ink); text-decoration: none; }
  .chip.stock { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; }
  .spacer { flex: 1; }
  #levels { display: flex; align-items: center; gap: 4px; }
  #levels button:disabled { opacity: .4; cursor: default; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 11px; cursor: pointer; min-height: 40px; }
  button:hover { border-color: var(--dim); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1b1608; font-weight: 600; }
  button kbd { font: 11px var(--mono); opacity: .6; margin-left: 5px; }
  #dock { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  #dock .bar { position: static; justify-content: center; }
  #dock button { display: inline-flex; align-items: center; gap: 6px; }
  #groups button[aria-pressed="true"] { background: var(--line); border-color: var(--dim); color: var(--ink); }
  #dock button.cant { opacity: .55; }
  .costs { display: inline-flex; gap: 5px; margin-left: 2px; }
  .costs .icon { width: 14px; height: 14px; }
  .costs .amount { font-size: 11px; }
  .amount.short { color: #ff8a80; }
  #research { position: fixed; inset: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--ground); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; z-index: 5; }
  #research header { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #research h2 { font-size: 16px; margin: 0; }
  #research header .close { margin-left: auto; min-height: 32px; padding: 2px 10px; }
  #r-active { color: var(--dim); font-size: 13px; }
  #r-scroll { overflow: auto; flex: 1; }
  #r-tree { position: relative; display: flex; gap: 56px; width: max-content; min-height: 100%; padding: 16px 20px; }
  #r-lines { position: absolute; left: 0; top: 0; pointer-events: none; }
  .r-col { display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .r-card { position: relative; width: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
  .r-card.done { border-color: #4f9d5d; }
  .r-card.active { border-color: var(--accent); }
  .r-card.locked { opacity: .6; }
  .r-card b { display: block; font-size: 14px; }
  .r-card .note { color: var(--dim); font-size: 12px; }
  .r-card .costs, .r-card .unlocks { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; align-items: center; }
  .r-card .icon { width: 18px; height: 18px; }
  .r-card button { width: 100%; margin-top: 7px; min-height: 32px; padding: 3px 8px; }
  .r-card button:disabled { opacity: .5; cursor: default; }
  .icon { width: 20px; height: 20px; image-rendering: pixelated; flex: none; }
  .panel { position: fixed; right: 12px; top: calc(60px + env(safe-area-inset-top, 0px)); width: 300px;
    max-width: calc(100% - 24px); max-height: calc(100% - 210px); overflow-y: auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .panel header { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  .panel header .close { margin-left: auto; min-height: 32px; padding: 2px 10px; }
  .panel h3 { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); margin: 12px 0 4px; font-weight: 600; }
  .panel p { margin: 4px 0; }
  .meter { height: 5px; background: var(--ground); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .meter i { display: block; height: 100%; background: var(--accent); width: 0; }
  .row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .row .right { margin-left: auto; font-family: var(--mono); font-size: 12px; }
  .recipe { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; width: 100%; text-align: left; margin-top: 4px; min-height: 36px; padding: 5px 8px; }
  .recipe .time { margin-left: auto; font: 11px var(--mono); opacity: .75; }
  .amount { display: inline-flex; align-items: center; gap: 2px; font: 12px var(--mono); }
  .amount.network .icon { outline: 1px dashed currentColor; outline-offset: 1px; }
  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 4px; }
  .picks button { padding: 4px; min-height: 36px; display: flex; justify-content: center; align-items: center; }
  .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .stats-table th { text-align: right; color: var(--dim); font-weight: 600; font-size: 11px; }
  .stats-table th:first-child { text-align: left; }
  .stats-table td { padding: 2px 0; font-family: var(--mono); font-size: 12px; text-align: right; }
  .stats-table td:first-child { font-family: inherit; font-size: 13px; text-align: left; }
  .stats-table .name { display: flex; align-items: center; gap: 6px; }
  #status { position: fixed; left: 50%; bottom: calc(112px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent);
    border-radius: 6px; padding: 6px 12px; max-width: calc(100% - 32px); }
  @media (max-width: 560px) {
    button kbd { display: none; }
    #dock .bar { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; }
    #dock button { flex: none; }
    .panel { left: 12px; right: 12px; top: auto; width: auto; bottom: calc(116px + env(safe-area-inset-bottom, 0px)); max-height: 45%; }
    #status { bottom: calc(116px + env(safe-area-inset-bottom, 0px)); }
  }
</style>
</head>
<body>
<canvas id="view" aria-label="Factory map"></canvas>
<canvas id="view3d" aria-label="Factory in 3D" hidden></canvas>

<div class="bar" id="hud">
  <a class="chip" href="../">&larr; Docs</a>
  <div class="chip"><span>tick</span> <b id="tick">0</b></div>
  <button id="stats-toggle" aria-expanded="false">Production<kbd>P</kbd></button>
  <button id="research-toggle" aria-expanded="false">Research<kbd>T</kbd></button>
  <div id="levels" role="group" aria-label="Building level" hidden>
    <button id="level-down" aria-label="One level down">&#9660;<kbd>Z</kbd></button>
    <div class="chip"><span>level</span> <b id="level">0</b></div>
    <button id="level-up" aria-label="One level up">&#9650;<kbd>C</kbd></button>
  </div>
  <div class="spacer" id="hud-spacer"></div>
  <div class="chip" title="Hash of the full simulation state"><span>state</span> <b id="hash">-</b></div>
</div>

<div id="dock">
  <div class="bar" id="tools" role="toolbar" aria-label="Build tools"></div>
  <div class="bar" id="groups" role="toolbar" aria-label="Tool sections and actions"></div>
</div>

<section id="research" aria-label="Research tree" hidden>
  <header><h2>Research</h2><span id="r-active"></span>
    <button class="close" id="r-close" aria-label="Close">&times;</button></header>
  <div id="r-scroll"><div id="r-tree"></div></div>
</section>

<aside class="panel" id="inspector" hidden>
  <header><canvas class="icon" id="i-icon" width="16" height="16"></canvas><span id="i-name"></span>
    <button class="close" id="i-close" aria-label="Close">&times;</button></header>
  <p id="i-status"></p>
  <div class="meter" id="i-meter" hidden><i id="i-progress"></i></div>
  <div id="i-choices"></div>
  <div id="i-live"></div>
</aside>

<aside class="panel" id="stats" hidden>
  <header><span>Production</span><button class="close" id="s-close" aria-label="Close">&times;</button></header>
  <div id="s-body"></div>
</aside>

<div id="status" role="status" hidden></div>

<script>
(async () => {
  const TICK_MS = 1000 / 60;
  const MAX_STEPS_PER_FRAME = 6;
  const TILE_UNITS = 256;
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const DIR_NAMES = ['↑', '→', '↓', '←'];
  // Indices into the Tiny Factory sheet: 12 columns of 16x16 tiles. Units,
  // resources and map layers name their own sprites in the rule pack.
  const SHEET_COLUMNS = 12, SHEET_TILE = 16;
  const FLOOR_SPRITE = 0;
  // Keyed by [has input behind][has output ahead]; the second animation frame
  // is one row down for horizontal belts and one column right for vertical ones.
  // Horizontal frames sit one row down and vertical frames one column right.
  const BELT_ART = [
    { horizontal: [[24, 25], [27, 26]], vertical: [[12, 28], [4, 16]] },
    { horizontal: [[48, 49], [51, 50]], vertical: [[14, 64], [40, 52]] },
  ];
  const TINT_STRENGTH = 0.6, GROUND_TINT_STRENGTH = 0.55, HAZE_STRENGTH = 0.8;
  const STATUS_MARKS = { 2: '#e05252', 3: '#b9bdc2', 4: '#f2b63c', 6: '#e05252' };
  const STATUS_TEXT = ['Waiting for inputs', 'Working', 'Not enough %', 'Held back by map conditions', 'Output has nowhere to go', 'Standing by: nothing needs its output yet', 'Not connected'];
  const PORT_TURNS = [0, -1, 1];
  const LOWER_LEVEL_ALPHA = 0.5, LOWER_LEVEL_FADE = 0.55;
  const ZOOM_MIN = 32, ZOOM_MAX = 96, ZOOM_STEP = 16;

  const canvas = document.getElementById('view');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const $ = (id) => document.getElementById(id);
  const key = (c) => c.x + ',' + c.y + ',' + c.z;

  let statusTimer = 0;
  function say(text, ms = 2200) {
    statusEl.textContent = text;
    statusEl.hidden = false;
    clearTimeout(statusTimer);
    if (ms) statusTimer = setTimeout(() => { statusEl.hidden = true; }, ms);
  }

  let of;
  const sheet = new Image();
  try {
    sheet.src = 'assets/tiny-factory.png';
    const [source] = await Promise.all([fetch('openfactor.wasm'), sheet.decode()]);
    if (!source.ok) throw new Error('HTTP ' + source.status);
    const { instance } = await WebAssembly.instantiate(await source.arrayBuffer(), {});
    of = instance.exports;
  } catch (error) {
    say('The game could not load (' + error.message + '). Try reloading the page.', 0);
    return;
  }

  // Calls can grow wasm memory, so take the buffer only after the last call.
  const packPointer = of.of_pack_json(), packLength = of.of_pack_json_len();
  const pack = JSON.parse(new TextDecoder().decode(new Uint8Array(of.memory.buffer, packPointer, packLength)));
  const beltCount = pack.belts.length;
  const isBelt = (kind) => kind < beltCount;
  const unitOf = (b) => pack.units[b.kind - beltCount];
  const hex = (color) => '#' + color.toString(16).padStart(6, '0');
  pack.units.forEach((unit) => { unit.linked = new Set(unit.links.map(([resource]) => resource)); });

  // Tinted copies of sprites, made once each.
  const tintCache = new Map();
  function spriteSource(index, tint, strength = TINT_STRENGTH) {
    const sx = (index % SHEET_COLUMNS) * SHEET_TILE, sy = Math.floor(index / SHEET_COLUMNS) * SHEET_TILE;
    if (tint === null || tint === undefined) return { image: sheet, sx, sy };
    const id = index + ':' + tint + ':' + strength;
    let image = tintCache.get(id);
    if (!image) {
      image = document.createElement('canvas');
      image.width = image.height = SHEET_TILE;
      const c = image.getContext('2d');
      c.drawImage(sheet, sx, sy, SHEET_TILE, SHEET_TILE, 0, 0, SHEET_TILE, SHEET_TILE);
      c.globalCompositeOperation = 'source-atop';
      c.globalAlpha = strength;
      c.fillStyle = hex(tint);
      c.fillRect(0, 0, SHEET_TILE, SHEET_TILE);
      tintCache.set(id, image);
    }
    return { image, sx: 0, sy: 0 };
  }

  function paintIcon(canvas, sprite, tint) {
    const c = canvas.getContext('2d');
    c.clearRect(0, 0, SHEET_TILE, SHEET_TILE);
    const source = spriteSource(sprite, tint);
    c.drawImage(source.image, source.sx, source.sy, SHEET_TILE, SHEET_TILE, 0, 0, SHEET_TILE, SHEET_TILE);
  }
  function icon(sprite, tint) {
    const canvas = document.createElement('canvas');
    canvas.className = 'icon';
    canvas.width = canvas.height = SHEET_TILE;
    paintIcon(canvas, sprite, tint);
    return canvas;
  }
  const beltIcon = (belt) => BELT_ART[belt.style % BELT_ART.length].horizontal[1][1];

  const TOOLS = [
    ...pack.belts.map((belt, index) => (
      { id: 'belt:' + index, kind: index, label: belt.name, group: 'Logistics', belt: true, sprite: beltIcon(belt), tint: null, cost: belt.cost, lock: belt.lock })),
    ...pack.units.map((unit, index) => (
      { id: 'unit:' + unit.id, kind: beltCount + index, label: unit.name, group: unit.group, unit, sprite: unit.sprite, tint: unit.tint, cost: unit.cost, lock: unit.lock })),
  ];

  const isOpen = (lock) => lock === null || of.of_researched(lock) === 1;
  const affordable = (cost) => cost.every(([item, amount]) => (of.of_stock(item) >>> 0) >= amount);
  const GROUPS = [...new Set(TOOLS.map((t) => t.group))];
  const ACTIONS = [
    { id: 'inspect', label: 'Inspect', key: 'I' },
    { id: 'erase', label: 'Erase', key: 'X' },
    { id: 'move', label: 'Move', key: 'M' },
  ];

  let tool = TOOLS[0], group = GROUPS[0];
  let rotation = 1;
  let cam = { x: 16, y: 9, cell: window.innerWidth < 700 ? 32 : 48 };
  let width = 0, height = 0;
  let ground = new Map(), haze = [], buildings = new Map(), items = [];
  let hover = null, drag = null, pan = null;
  // The level being built on. 0 is the ground.
  let level = 0;
  let selected = null;
  // The 3D view is loaded the first time it is opened.
  let view3d = null, use3d = false, loading3d = false;

  // Toolbar: one row for the open section's tools, one for sections and actions.
  const toolbar = $('tools'), groupbar = $('groups');
  const buttons = new Map(), groupButtons = new Map();
  const groupTools = () => TOOLS.filter((t) => t.group === group && isOpen(t.lock));

  function renderTools() {
    toolbar.replaceChildren();
    buttons.clear();
    groupTools().forEach((t, index) => {
      const b = document.createElement('button');
      b.append(icon(t.sprite, t.tint), t.label);
      if (t.cost.length) {
        const costs = document.createElement('span');
        costs.className = 'costs';
        for (const [item, amount] of t.cost) costs.append(amountChip(['l', item, amount]));
        b.append(costs);
      }
      if (index < 9) { const k = document.createElement('kbd'); k.textContent = index + 1; b.append(k); }
      b.setAttribute('aria-pressed', t === tool);
      b.addEventListener('click', () => selectTool(t));
      toolbar.append(b);
      buttons.set(t, b);
    });
  }
  // Sections with nothing researched yet stay out of the way.
  function refreshGroups() {
    for (const [name, b] of groupButtons) b.hidden = !TOOLS.some((t) => t.group === name && isOpen(t.lock));
  }
  function refreshAffordable() {
    for (const [t, b] of buttons) b.classList.toggle('cant', !affordable(t.cost));
  }
  function selectGroup(name) {
    group = name;
    for (const [other, b] of groupButtons) b.setAttribute('aria-pressed', other === name);
    renderTools();
    refreshAffordable();
  }
  function selectTool(t) {
    tool = t;
    for (const [other, b] of buttons) b.setAttribute('aria-pressed', other === t);
    for (const [other, b] of actionButtons) b.setAttribute('aria-pressed', other === t);
    if (t.unit && t.unit.route === 'lift') {
      say(t.label + ': build one at each end of the shaft, on different levels. Z and C change level.', 5000);
    }
  }

  function setLevel(value) {
    level = Math.max(0, Math.min(pack.levels - 1, value));
    $('level').textContent = level;
    $('level-down').disabled = level === 0;
    $('level-up').disabled = level === pack.levels - 1;
    if (hover) hover = { ...hover, z: level };
  }
  $('level-down').addEventListener('click', () => setLevel(level - 1));
  $('level-up').addEventListener('click', () => setLevel(level + 1));

  // The level control appears once there is a way to move items between levels.
  function refreshLevels() {
    const open = pack.levels > 1 && TOOLS.some((t) => t.unit && t.unit.route === 'lift' && isOpen(t.lock));
    $('levels').hidden = !open;
    if (!open && level !== 0) setLevel(0);
  }

  for (const name of GROUPS) {
    const b = document.createElement('button');
    b.textContent = name;
    b.addEventListener('click', () => selectGroup(name));
    groupbar.append(b);
    groupButtons.set(name, b);
  }
  const actionButtons = new Map();
  for (const action of ACTIONS) {
    const b = document.createElement('button');
    b.innerHTML = action.label + '<kbd>' + action.key + '</kbd>';
    b.addEventListener('click', () => selectTool(action));
    groupbar.append(b);
    actionButtons.set(action, b);
  }
  const viewButton = document.createElement('button');
  viewButton.innerHTML = '3D view<kbd>V</kbd>';
  viewButton.addEventListener('click', () => toggle3d());
  groupbar.append(viewButton);
  const rotateButton = document.createElement('button');
  rotateButton.addEventListener('click', () => rotate());
  groupbar.append(rotateButton);
  const resetButton = document.createElement('button');
  resetButton.textContent = 'Reset';
  let resetArmed = 0;
  resetButton.addEventListener('click', () => {
    if (resetArmed) {
      clearTimeout(resetArmed); resetArmed = 0;
      resetButton.textContent = 'Reset';
      of.of_reset();
      closeInspector();
      setLevel(0);
      progress = '';
      return;
    }
    resetButton.textContent = 'Really reset?';
    resetArmed = setTimeout(() => { resetArmed = 0; resetButton.textContent = 'Reset'; }, 3000);
  });
  groupbar.append(resetButton);

  function showRotation() { rotateButton.innerHTML = 'Facing ' + DIR_NAMES[rotation] + '<kbd>R</kbd>'; }
  function rotate() { rotation = (rotation + 1) % 4; showRotation(); }
  refreshGroups();
  setLevel(0);
  refreshLevels();
  selectGroup(group);
  selectTool(tool);
  showRotation();

  // Inspector
  const decoder = new TextDecoder();
  function inspect(cell) {
    const pointer = of.of_inspect(cell.x, cell.y, cell.z), length = of.of_inspect_len();
    return JSON.parse(decoder.decode(new Uint8Array(of.memory.buffer, pointer, length)));
  }

  function amountChip([scope, id, amount]) {
    const span = document.createElement('span');
    span.className = 'amount' + (scope === 'n' ? ' network' : '');
    if (scope === 'm') {
      span.textContent = pack.layers[id].name + ' ' + amount;
    } else {
      const resource = pack.resources[id];
      const image = icon(resource.sprite, resource.tint);
      image.title = resource.name + (scope === 'n' ? ' (network)' : '');
      span.append(image, String(amount));
    }
    return span;
  }

  function recipeButton(rule, pressed, onChoose) {
    const b = document.createElement('button');
    b.className = 'recipe';
    b.setAttribute('aria-pressed', pressed);
    const visible = (list) => list.filter(([scope, id]) => !(scope === 'm' && pack.layers[id].haze !== null));
    visible(rule.in).forEach((entry) => b.append(amountChip(entry)));
    b.append(' → ');
    visible(rule.out).forEach((entry) => b.append(amountChip(entry)));
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = (rule.rate / 60).toFixed(rule.rate % 6 ? 2 : 1) + ' s';
    b.append(time);
    b.addEventListener('click', onChoose);
    return b;
  }

  function heading(text) {
    const h = document.createElement('h3');
    h.textContent = text;
    return h;
  }

  function choose(value) {
    of.of_configure(selected.x, selected.y, selected.z, value);
    selected.setting = value < 0 ? null : value;
    selected.pendingSetting = true;
    renderChoices();
  }

  function renderChoices() {
    const holder = $('i-choices');
    holder.replaceChildren();
    if (isBelt(selected.kind)) return;
    const unit = pack.units[selected.kind - beltCount];
    if (unit.route === 'filter') {
      holder.append(heading('Sends straight on'));
      const picks = document.createElement('div');
      picks.className = 'picks';
      const clear = document.createElement('button');
      clear.textContent = 'All';
      clear.setAttribute('aria-pressed', selected.setting === null);
      clear.addEventListener('click', () => choose(-1));
      picks.append(clear);
      pack.resources.forEach((resource, index) => {
        if (resource.networkOnly) return;
        const b = document.createElement('button');
        b.title = resource.name;
        b.append(icon(resource.sprite, resource.tint));
        b.setAttribute('aria-pressed', selected.setting === index);
        b.addEventListener('click', () => choose(index));
        picks.append(b);
      });
      holder.append(picks);
    } else if (unit.rules.length > 1) {
      holder.append(heading('Recipe'));
      const auto = document.createElement('button');
      auto.className = 'recipe';
      auto.textContent = 'Automatic: first one that can start';
      auto.setAttribute('aria-pressed', selected.setting === null);
      auto.addEventListener('click', () => choose(-1));
      holder.append(auto);
      unit.rules.forEach((rule, index) => {
        if (isOpen(rule.lock)) holder.append(recipeButton(rule, selected.setting === index, () => choose(index)));
      });
    } else if (unit.rules.length === 1) {
      holder.append(heading('Recipe'));
      const only = recipeButton(unit.rules[0], false, () => {});
      only.disabled = true;
      holder.append(only);
    }
  }

  function openInspector(cell) {
    const view = inspect(cell);
    if (!view) return;
    selected = { x: cell.x, y: cell.y, z: cell.z, kind: view.kind, setting: view.setting, pendingSetting: false };
    const unit = isBelt(view.kind) ? null : pack.units[view.kind - beltCount];
    $('i-name').textContent = (unit ? unit.name : pack.belts[view.kind].name) + (cell.z > 0 ? ' · level ' + cell.z : '');
    if (unit) paintIcon($('i-icon'), unit.sprite, unit.tint);
    else paintIcon($('i-icon'), beltIcon(pack.belts[view.kind]), null);
    renderChoices();
    $('inspector').hidden = false;
    $('stats').hidden = true;
    $('stats-toggle').setAttribute('aria-expanded', false);
    refreshInspector();
  }
  function closeInspector() { selected = null; $('inspector').hidden = true; }
  $('i-close').addEventListener('click', closeInspector);

  function refreshInspector() {
    if (!selected) return;
    const view = inspect(selected);
    if (!view || view.kind !== selected.kind) return closeInspector();
    if (view.setting !== selected.setting) {
      // A click is applied on the next step, so wait for it before redrawing.
      if (selected.pendingSetting) { selected.pendingSetting = false; return; }
      selected.setting = view.setting;
      renderChoices();
    }
    selected.pendingSetting = false;

    const belt = isBelt(view.kind);
    const unit = belt ? null : pack.units[view.kind - beltCount];
    let status;
    if (belt) {
      status = 'Moves ' + (pack.belts[view.kind].speed * 60 / TILE_UNITS).toFixed(2).replace(/\.?0+$/, '') + ' tiles a second';
    } else if (unit.route === 'lift') {
      const way = unit.down ? 'below' : 'above';
      if (view.sendsTo !== null) status = 'Carries items to level ' + view.sendsTo;
      else if (view.receivesFrom !== null) status = 'Receives from level ' + view.receivesFrom + ' and sends items out of its front';
      else status = 'Not connected: build another ' + unit.name + ' up to ' + unit.range + ' levels ' + way + ', with nothing in the shaft';
    } else if (unit.route === 'tunnel') {
      status = 'Sends to the next tunnel facing the same way, up to ' + unit.range + ' tiles ahead';
    } else if (unit.route === 'filter') {
      status = 'Chosen items go straight on, the rest leave by the sides';
    } else if (unit.route) {
      status = 'Shares items between its front and sides';
    } else if (!unit.rules.length) {
      status = unit.delivers ? 'Adds what it receives to the shared stock' : unit.accepts ? 'Stores whatever is delivered to it' : 'Connects nearby buildings to its network';
    } else {
      status = STATUS_TEXT[view.status].replace('%', view.missing >= 0 ? pack.resources[view.missing].name.toLowerCase() : '');
    }
    $('i-status').textContent = status;

    const meter = $('i-meter');
    meter.hidden = !view.job;
    if (view.job) {
      const rate = unit.rules[view.job[0]].rate;
      $('i-progress').style.width = (100 * (rate - view.job[1]) / rate) + '%';
    }

    const live = $('i-live');
    live.replaceChildren();
    if (view.held.length) {
      live.append(heading('Holding'));
      for (const [item, count] of view.held) {
        const row = document.createElement('div');
        row.className = 'row';
        row.append(icon(pack.resources[item].sprite, pack.resources[item].tint), pack.resources[item].name);
        const right = document.createElement('span');
        right.className = 'right';
        right.textContent = count.toLocaleString('en');
        row.append(right);
        live.append(row);
      }
    }
    if (view.networks.length) {
      live.append(heading('Networks'));
      for (const [resource, members, producers, stock] of view.networks) {
        const row = document.createElement('div');
        row.className = 'row';
        row.append(icon(pack.resources[resource].sprite, pack.resources[resource].tint),
          pack.resources[resource].name + ': ' + members + ' linked, ' + producers + ' supplying');
        const right = document.createElement('span');
        right.className = 'right';
        right.textContent = stock.toLocaleString('en');
        right.title = 'Available now';
        row.append(right);
        live.append(row);
      }
    }
  }

  // Resources only ever moved over networks are not choices for a sorter.
  const carried = new Set();
  for (const unit of pack.units) {
    for (const rule of unit.rules) {
      for (const [scope, id] of [...rule.in, ...rule.out]) if (scope === 'l') carried.add(id);
    }
  }
  pack.resources.forEach((resource, index) => { resource.networkOnly = !carried.has(index); });

  // Research tree
  const research = $('research'), tree = $('r-tree');
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const depthOf = (index) => pack.techs[index].requires.reduce((depth, required) => Math.max(depth, depthOf(required) + 1), 0);
  const techUnlocks = pack.techs.map(() => []);
  pack.belts.forEach((belt) => { if (belt.lock !== null) techUnlocks[belt.lock].push({ sprite: beltIcon(belt), tint: null, title: belt.name }); });
  pack.units.forEach((unit) => {
    if (unit.lock !== null) techUnlocks[unit.lock].push({ sprite: unit.sprite, tint: unit.tint, title: unit.name });
    for (const rule of unit.rules) {
      const made = rule.out.find(([scope]) => scope === 'l');
      if (rule.lock === null || !made) continue;
      const resource = pack.resources[made[1]];
      techUnlocks[rule.lock].push({ sprite: resource.sprite, tint: resource.tint, title: resource.name + ' in ' + unit.name });
    }
  });

  const techState = (index, active) => {
    if (of.of_researched(index)) return 'done';
    if (active === index) return 'active';
    return pack.techs[index].requires.every((required) => of.of_researched(required)) ? 'available' : 'locked';
  };
  const STATE_NOTES = { done: 'Researched', active: 'In progress', available: 'Available', locked: 'Needs earlier research' };

  let cards = [];
  function renderResearch() {
    const active = of.of_research_active();
    tree.replaceChildren();
    const columns = [];
    cards = pack.techs.map((tech, index) => {
      const depth = depthOf(index);
      if (!columns[depth]) {
        columns[depth] = document.createElement('div');
        columns[depth].className = 'r-col';
      }
      const state = techState(index, active);
      const card = document.createElement('article');
      card.className = 'r-card ' + state;
      const name = document.createElement('b');
      name.textContent = tech.name;
      const note = document.createElement('span');
      note.className = 'note';
      note.textContent = STATE_NOTES[state] + ' · ' + Math.round(tech.time / 60) + ' s';
      card.append(name, note);
      const costs = document.createElement('div');
      costs.className = 'costs';
      const chips = tech.cost.map(([item, amount]) => {
        const chip = amountChip(['l', item, amount]);
        costs.append(chip);
        return { chip, item, amount };
      });
      if (state !== 'done') card.append(costs);
      const unlocks = document.createElement('div');
      unlocks.className = 'unlocks';
      for (const unlock of techUnlocks[index]) {
        const image = icon(unlock.sprite, unlock.tint);
        image.title = unlock.title;
        unlocks.append(image);
      }
      card.append(unlocks);
      let meter = null, button = null;
      if (state === 'active') {
        const bar = document.createElement('div');
        bar.className = 'meter';
        meter = document.createElement('i');
        bar.append(meter);
        card.append(bar);
      } else if (state === 'available') {
        button = document.createElement('button');
        button.textContent = 'Research';
        button.addEventListener('click', () => of.of_research(index));
        card.append(button);
      }
      columns[depth].append(card);
      return { card, chips, meter, button, tech, state };
    });
    tree.append(...columns);

    // Lines are drawn once the cards have their positions.
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.id = 'r-lines';
    svg.setAttribute('width', tree.scrollWidth);
    svg.setAttribute('height', tree.scrollHeight);
    cards.forEach(({ card, tech, state }) => {
      for (const required of tech.requires) {
        const from = cards[required].card;
        const startX = from.offsetLeft + from.offsetWidth, startY = from.offsetTop + from.offsetHeight / 2;
        const endX = card.offsetLeft, endY = card.offsetTop + card.offsetHeight / 2;
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', `M${startX} ${startY} C${startX + 28} ${startY} ${endX - 28} ${endY} ${endX} ${endY}`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', state === 'locked' ? '#363c45' : '#f2b63c');
        path.setAttribute('stroke-width', 1.5);
        svg.append(path);
      }
    });
    tree.prepend(svg);
  }

  function refreshResearch() {
    if (research.hidden) return;
    const active = of.of_research_active();
    $('r-active').textContent = active >= 0
      ? pack.techs[active].name + ': ' + Math.ceil(of.of_research_left() / 60) + ' s left'
      : 'Nothing in progress';
    for (const { chips, meter, button, tech, state } of cards) {
      for (const { chip, item, amount } of chips) {
        chip.classList.toggle('short', state !== 'done' && (of.of_stock(item) >>> 0) < amount);
      }
      if (meter) meter.style.width = (100 * (tech.time - of.of_research_left()) / tech.time) + '%';
      if (button) button.disabled = active >= 0 || !affordable(tech.cost);
    }
  }

  function toggleResearch() {
    research.hidden = !research.hidden;
    $('research-toggle').setAttribute('aria-expanded', !research.hidden);
    if (!research.hidden) { renderResearch(); refreshResearch(); }
  }
  $('research-toggle').addEventListener('click', toggleResearch);
  $('r-close').addEventListener('click', toggleResearch);

  // Everything that depends on what has been researched, redone when that changes.
  let progress = '';
  function refreshProgress() {
    const active = of.of_research_active();
    const current = active + ':' + pack.techs.map((_, index) => of.of_researched(index)).join('');
    if (current === progress) return;
    const finished = progress !== '' && current.split(':')[1] !== progress.split(':')[1];
    progress = current;
    refreshLevels();
    refreshGroups();
    renderTools();
    refreshAffordable();
    if (selected) renderChoices();
    if (!research.hidden) renderResearch();
    if (finished) say('Research finished.');
  }

  // Production panel
  function refreshStats() {
    if ($('stats').hidden) return;
    const body = $('s-body');
    const table = document.createElement('table');
    table.className = 'stats-table';
    const headerRow = table.insertRow();
    for (const label of ['Resource', 'Stock', 'Made', 'Used']) {
      const th = document.createElement('th');
      th.textContent = label;
      headerRow.append(th);
    }
    let rows = 0;
    pack.resources.forEach((resource, index) => {
      const made = of.of_produced(index) >>> 0, stock = of.of_stock(index) >>> 0;
      if (!made && !stock) return;
      rows++;
      const row = table.insertRow();
      const name = document.createElement('span');
      name.className = 'name';
      name.append(icon(resource.sprite, resource.tint), resource.name);
      row.insertCell().append(name);
      row.insertCell().textContent = stock.toLocaleString('en');
      row.insertCell().textContent = made.toLocaleString('en');
      row.insertCell().textContent = (of.of_consumed(index) >>> 0).toLocaleString('en');
    });
    body.replaceChildren();
    if (rows) body.append(table); else body.textContent = 'Nothing made yet.';
    const totals = pack.metrics.map((metric, index) => [metric.name, of.of_metric(index) >>> 0]).filter(([, value]) => value);
    if (totals.length) {
      body.append(heading('Totals'));
      for (const [name, value] of totals) {
        const row = document.createElement('div');
        row.className = 'row';
        row.append(name);
        const right = document.createElement('span');
        right.className = 'right';
        right.textContent = value.toLocaleString('en');
        row.append(right);
        body.append(row);
      }
    }
  }
  function toggleStats() {
    const stats = $('stats');
    stats.hidden = !stats.hidden;
    $('stats-toggle').setAttribute('aria-expanded', !stats.hidden);
    if (!stats.hidden) { $('inspector').hidden = true; selected = null; refreshStats(); }
  }
  $('stats-toggle').addEventListener('click', toggleStats);
  $('s-close').addEventListener('click', toggleStats);

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    if (use3d) view3d.resize(width, height);
  }
  window.addEventListener('resize', resize);
  resize();

  async function toggle3d() {
    if (loading3d) return;
    if (!view3d) {
      loading3d = true;
      say('Loading the 3D view…', 0);
      try {
        const { createView3d } = await import('./view3d.js?v=2');
        view3d = await createView3d({ pack, canvas: $('view3d'), spriteSource, isBelt, DIRS, PORT_TURNS, beltCount });
        statusEl.hidden = true;
      } catch (error) {
        say('The 3D view could not start (' + error.message + ').', 6000);
        return;
      } finally {
        loading3d = false;
      }
    }
    use3d = !use3d;
    $('view3d').hidden = !use3d;
    viewButton.innerHTML = (use3d ? '2D view' : '3D view') + '<kbd>V</kbd>';
    if (use3d) view3d.resize(width, height);
  }

  const cellAt = (e) => (use3d ? { ...view3d.cellAt(e.clientX, e.clientY, level), z: level } : {
    x: Math.floor(cam.x + (e.clientX - width / 2) / cam.cell),
    y: Math.floor(cam.y + (e.clientY - height / 2) / cam.cell),
    z: level,
  });

  // The same test the simulation makes, to warn before the click.
  function canStand(cell) {
    if (cell.z === 0) return true;
    for (let dx = -pack.span; dx <= pack.span; dx++) {
      const spread = pack.span - Math.abs(dx);
      for (let dy = -spread; dy <= spread; dy++) if (buildingAt(cell.x + dx, cell.y + dy, cell.z - 1)) return true;
    }
    return false;
  }

  function applyAt(cell) {
    const k = key(cell);
    if (drag.touched.has(k) || tool.id === 'inspect') return;
    const occupied = buildings.has(k);
    if (tool.id === 'erase') {
      if (occupied) { of.of_remove(cell.x, cell.y, cell.z); drag.touched.add(k); }
    } else if (!occupied) {
      of.of_place(cell.x, cell.y, cell.z, rotation, tool.kind);
      drag.touched.add(k);
    }
  }

  // Dragging a belt steers it: each laid tile turns to point at the next.
  function dragTo(cell) {
    while (drag.last.x !== cell.x || drag.last.y !== cell.y) {
      const dx = Math.sign(cell.x - drag.last.x), dy = dx ? 0 : Math.sign(cell.y - drag.last.y);
      const next = { x: drag.last.x + dx, y: drag.last.y + dy, z: drag.last.z };
      if (tool.belt) {
        rotation = DIRS.findIndex(([x, y]) => x === dx && y === dy);
        showRotation();
        if (drag.touched.has(key(drag.last))) {
          of.of_remove(drag.last.x, drag.last.y, drag.last.z);
          of.of_place(drag.last.x, drag.last.y, drag.last.z, rotation, tool.kind);
        }
      }
      drag.last = next;
      applyAt(next);
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    if (e.button !== 0 || tool.id === 'move') {
      pan = { x: e.clientX, y: e.clientY, camX: cam.x, camY: cam.y, ground: use3d ? view3d.groundAt(e.clientX, e.clientY, cam) : null };
      return;
    }
    const cell = cellAt(e);
    // Pressing an existing building opens it, unless the press turns into a drag.
    const opens = tool.id === 'inspect' || (tool.id !== 'erase' && buildings.has(key(cell)));
    drag = { last: cell, touched: new Set(), opens };
    applyAt(cell);
  });
  canvas.addEventListener('pointermove', (e) => {
    hover = cellAt(e);
    if (pan && use3d) {
      // Keep the ground point that was grabbed under the pointer.
      const point = view3d.groundAt(e.clientX, e.clientY, cam);
      cam.x += pan.ground.x - point.x;
      cam.y += pan.ground.y - point.y;
    } else if (pan) {
      cam.x = pan.camX - (e.clientX - pan.x) / cam.cell;
      cam.y = pan.camY - (e.clientY - pan.y) / cam.cell;
    } else if (drag && (hover.x !== drag.last.x || hover.y !== drag.last.y)) {
      drag.opens = false;
      dragTo(hover);
    }
  });
  const endPointer = () => { drag = null; pan = null; };
  canvas.addEventListener('pointerup', (e) => {
    if (drag && drag.opens) {
      const cell = cellAt(e);
      if (buildings.has(key(cell))) openInspector(cell); else closeInspector();
    }
    endPointer();
  });
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', () => { hover = null; });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const step = e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP;
    cam.cell = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, cam.cell + step));
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    const lower = e.key.toLowerCase();
    if (lower === 'r') return rotate();
    if (lower === 'v') return toggle3d();
    if (use3d && (lower === 'q' || lower === 'e')) return view3d.rotateView(lower === 'q' ? -1 : 1);
    if (!$('levels').hidden && (lower === 'z' || lower === 'c')) return setLevel(level + (lower === 'c' ? 1 : -1));
    if (lower === 'p') return toggleStats();
    if (lower === 't') return toggleResearch();
    if (lower === 'escape') {
      if (!research.hidden) return toggleResearch();
      return closeInspector();
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      const open = GROUPS.filter((name) => !groupButtons.get(name).hidden);
      return selectGroup(open[(open.indexOf(group) + 1) % open.length]);
    }
    if (/^[1-9]$/.test(e.key)) {
      const t = groupTools()[Number(e.key) - 1];
      if (t) selectTool(t);
      return;
    }
    const action = ACTIONS.find((x) => x.key.toLowerCase() === lower);
    if (action) return selectTool(action);
    const panStep = 2;
    const moves = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
    if (moves[lower]) {
      e.preventDefault();
      const [moveX, moveY] = use3d ? view3d.panVector(...moves[lower]) : moves[lower];
      cam.x += moveX * panStep;
      cam.y += moveY * panStep;
    }
  });

  function readSnapshot() {
    const pointer = of.of_snapshot(), length = of.of_snapshot_len();
    const data = new Int32Array(of.memory.buffer, pointer, length);
    let i = 0;
    ground = new Map();
    for (let n = data[i++]; n > 0; n--, i += 3) ground.set(data[i] + ',' + data[i + 1], data[i + 2]);
    haze = [];
    for (let n = data[i++]; n > 0; n--, i += 4) haze.push({ x: data[i], y: data[i + 1], layer: data[i + 2], strength: data[i + 3] });
    buildings = new Map();
    for (let n = data[i++]; n > 0; n--, i += 6) {
      const b = { x: data[i], y: data[i + 1], z: data[i + 2], dir: data[i + 3], kind: data[i + 4], status: data[i + 5] };
      buildings.set(key(b), b);
    }
    items = [];
    for (let n = data[i++]; n > 0; n--, i += 6) {
      const along = data[i + 4] / TILE_UNITS - 0.5, [dx, dy] = DIRS[data[i + 3]];
      items.push({ x: data[i] + 0.5 + dx * along, y: data[i + 1] + 0.5 + dy * along, z: data[i + 2], item: data[i + 5] });
    }
  }

  // Whole pixels only: fractional positions leave seams between tiles.
  const sx = (x) => Math.round((x - cam.x) * cam.cell + width / 2);
  const sy = (y) => Math.round((y - cam.y) * cam.cell + height / 2);

  function drawSprite(index, x, y, size, flipX = false, flipY = false, tint = null, strength = TINT_STRENGTH) {
    const source = spriteSource(index, tint, strength);
    ctx.save();
    ctx.translate(x + (flipX ? size : 0), y + (flipY ? size : 0));
    ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
    ctx.drawImage(source.image, source.sx, source.sy, SHEET_TILE, SHEET_TILE, 0, 0, size, size);
    ctx.restore();
  }

  const buildingAt = (x, y, z) => buildings.get(x + ',' + y + ',' + z);

  function beltHasOutput(b) {
    const [dx, dy] = DIRS[b.dir];
    const front = buildingAt(b.x + dx, b.y + dy, b.z);
    if (!front) return false;
    return isBelt(front.kind) ? front.dir !== (b.dir + 2) % 4 : unitOf(front).accepts;
  }

  function beltHasInput(b) {
    return DIRS.some(([dx, dy], side) => {
      if (side === b.dir) return false;
      const neighbour = buildingAt(b.x + dx, b.y + dy, b.z);
      if (!neighbour) return false;
      const toward = (side + 2) % 4;
      if (isBelt(neighbour.kind)) return neighbour.dir === toward;
      return unitOf(neighbour).ports.some((port) => (neighbour.dir + PORT_TURNS[port] + 4) % 4 === toward);
    });
  }

  function drawBelt(b, tick) {
    const x = sx(b.x), y = sy(b.y), frame = (tick >> 3) & 1;
    const input = beltHasInput(b) ? 1 : 0, output = beltHasOutput(b) ? 1 : 0;
    const art = BELT_ART[pack.belts[b.kind].style % BELT_ART.length];
    if (b.dir === 1 || b.dir === 3) {
      drawSprite(art.horizontal[input][output] + frame * SHEET_COLUMNS, x, y, cam.cell, b.dir === 3);
    } else {
      drawSprite(art.vertical[input][output] + frame, x, y, cam.cell, false, b.dir === 2);
    }
  }

  function drawOutputArrow(b, turn) {
    ctx.save();
    ctx.translate(sx(b.x + 0.5), sy(b.y + 0.5));
    ctx.rotate((b.dir + turn - 1) * Math.PI / 2);
    ctx.scale(cam.cell, cam.cell);
    ctx.beginPath();
    ctx.moveTo(0.3, -0.14); ctx.lineTo(0.48, 0); ctx.lineTo(0.3, 0.14);
    ctx.closePath();
    ctx.fillStyle = turn ? '#ffd27a' : '#fff4d6';
    ctx.strokeStyle = '#3b2a3b';
    ctx.lineWidth = 0.04;
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawStatusMark(b) {
    const color = STATUS_MARKS[b.status];
    if (!color) return;
    const size = Math.max(6, Math.round(cam.cell / 5));
    const x = sx(b.x) + cam.cell - size - 2, y = sy(b.y) + 2;
    ctx.fillStyle = '#1b1608';
    ctx.fillRect(x - 1, y - 1, size + 2, size + 2);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, size, size);
  }

  // Which way a lift goes, in the corner of its tile.
  function drawLiftMark(b, unit) {
    const size = Math.max(10, Math.round(cam.cell / 3));
    ctx.font = size + 'px system-ui, sans-serif';
    ctx.textBaseline = 'top';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#1b1608';
    ctx.fillStyle = unit.down ? '#ffb27a' : '#8ff0a4';
    const glyph = unit.down ? '\u25BC' : '\u25B2';
    ctx.strokeText(glyph, sx(b.x) + 2, sy(b.y) + 1);
    ctx.fillText(glyph, sx(b.x) + 2, sy(b.y) + 1);
  }

  function drawBuilding(b, tick) {
    if (isBelt(b.kind)) return drawBelt(b, tick);
    const unit = unitOf(b);
    drawSprite(unit.sprite, sx(b.x), sy(b.y), cam.cell, false, false, unit.tint);
    for (const port of unit.ports) drawOutputArrow(b, PORT_TURNS[port]);
    if (unit.route === 'lift') drawLiftMark(b, unit);
    if (b.status !== undefined) drawStatusMark(b);
  }

  function linkColor(resource) {
    const definition = pack.resources[resource];
    return definition.tint !== null ? hex(definition.tint) : resource === 0 ? '#c9cdd3' : '#e8c04a';
  }

  // Pipes (reach 1) are drawn as runs under the art, longer links as wires above it.
  function drawLinks(visible, wires) {
    for (const b of buildings.values()) {
      if (isBelt(b.kind) || b.z !== level || !visible(b.x, b.y)) continue;
      for (const [resource, reach] of unitOf(b).links) {
        if (reach === 0 || (reach > 1) !== wires) continue;
        ctx.strokeStyle = wires ? 'rgba(232, 192, 74, .65)' : '#8ea0b8';
        ctx.lineWidth = wires ? 1 : Math.max(4, cam.cell / 5);
        ctx.lineCap = 'round';
        for (let dx = -reach; dx <= reach; dx++) {
          const spread = reach - Math.abs(dx);
          for (let dy = -spread; dy <= spread; dy++) {
            if (!dx && !dy) continue;
            const other = buildingAt(b.x + dx, b.y + dy, b.z);
            if (!other || isBelt(other.kind) || !unitOf(other).linked.has(resource)) continue;
            ctx.beginPath();
            ctx.moveTo(sx(b.x + 0.5), sy(b.y + 0.5));
            ctx.lineTo(sx(other.x + 0.5), sy(other.y + 0.5));
            ctx.stroke();
          }
        }
      }
    }
  }

  // Above the ground the map is dimmed, except where the level below can hold something up.
  function drawLevelFloor(left, right, top, bottom) {
    ctx.fillStyle = 'rgba(14, 17, 22, .62)';
    ctx.fillRect(0, 0, width, height);
    const lit = new Set();
    ctx.fillStyle = 'rgba(232, 214, 170, .14)';
    for (const b of buildings.values()) {
      if (b.z !== level - 1) continue;
      for (let dx = -pack.span; dx <= pack.span; dx++) {
        const spread = pack.span - Math.abs(dx);
        for (let dy = -spread; dy <= spread; dy++) {
          const x = b.x + dx, y = b.y + dy, id = x + ',' + y;
          if (x < left || x > right || y < top || y > bottom || lit.has(id)) continue;
          lit.add(id);
          ctx.fillRect(sx(x), sy(y), cam.cell, cam.cell);
        }
      }
    }
  }

  function drawReach(cell, reach) {
    ctx.fillStyle = 'rgba(242, 182, 60, .16)';
    for (let dx = -reach; dx <= reach; dx++) {
      const spread = reach - Math.abs(dx);
      for (let dy = -spread; dy <= spread; dy++) ctx.fillRect(sx(cell.x + dx), sy(cell.y + dy), cam.cell, cam.cell);
    }
  }

  function drawTunnelRange(cell, range) {
    const [dx, dy] = DIRS[rotation];
    ctx.fillStyle = 'rgba(242, 182, 60, .16)';
    for (let step = 1; step <= range; step++) ctx.fillRect(sx(cell.x + dx * step), sy(cell.y + dy * step), cam.cell, cam.cell);
  }

  function draw() {
    const tick = of.of_tick();

    const left = Math.floor(cam.x - width / 2 / cam.cell) - 1, right = Math.ceil(cam.x + width / 2 / cam.cell) + 1;
    const top = Math.floor(cam.y - height / 2 / cam.cell) - 1, bottom = Math.ceil(cam.y + height / 2 / cam.cell) + 1;
    const visible = (x, y) => x >= left && x <= right && y >= top && y <= bottom;

    for (let x = left; x <= right; x++) {
      for (let y = top; y <= bottom; y++) {
        const layer = ground.get(x + ',' + y);
        const definition = layer === undefined ? null : pack.layers[layer];
        const sprites = definition ? definition.sprites : [FLOOR_SPRITE];
        const sprite = sprites[Math.abs(x * 7 + y * 13) % sprites.length];
        drawSprite(sprite, sx(x), sy(y), cam.cell, false, false, definition ? definition.tint : null, GROUND_TINT_STRENGTH);
      }
    }
    if (level > 0) drawLevelFloor(left, right, top, bottom);
    // Lower levels show through, fainter the further down they are.
    for (let z = 0; z < level; z++) {
      ctx.globalAlpha = LOWER_LEVEL_ALPHA * Math.pow(LOWER_LEVEL_FADE, level - 1 - z);
      for (const b of buildings.values()) {
        if (b.z === z && visible(b.x, b.y)) drawBuilding({ ...b, status: undefined }, tick);
      }
    }
    ctx.globalAlpha = 1;
    drawLinks(visible, false);
    for (const b of buildings.values()) if (b.z === level && visible(b.x, b.y)) drawBuilding(b, tick);
    // Items scale by whole multiples of the art so their pixels stay even.
    const itemSize = SHEET_TILE * Math.floor(cam.cell / 32);
    for (const it of items) {
      if (it.z !== level || !visible(it.x, it.y)) continue;
      const resource = pack.resources[it.item];
      drawSprite(resource.sprite, sx(it.x) - itemSize / 2, sy(it.y) - itemSize / 2, itemSize, false, false, resource.tint);
    }
    for (const h of haze) {
      if (!visible(h.x, h.y)) continue;
      ctx.globalAlpha = h.strength / 255 * HAZE_STRENGTH;
      ctx.fillStyle = hex(pack.layers[h.layer].haze);
      ctx.fillRect(sx(h.x), sy(h.y), cam.cell, cam.cell);
    }
    ctx.globalAlpha = 1;
    drawLinks(visible, true);
    // Whatever is built higher up is only outlined.
    ctx.strokeStyle = 'rgba(190, 210, 240, .45)';
    ctx.lineWidth = 1;
    for (const b of buildings.values()) {
      if (b.z > level && visible(b.x, b.y)) ctx.strokeRect(sx(b.x) + 3.5, sy(b.y) + 3.5, cam.cell - 7, cam.cell - 7);
    }

    if (selected && selected.z === level) {
      ctx.strokeStyle = '#f2b63c';
      ctx.lineWidth = 3;
      ctx.strokeRect(sx(selected.x) + 1, sy(selected.y) + 1, cam.cell - 2, cam.cell - 2);
    }

    if (hover && !pan && tool.id !== 'move') {
      if (tool.id === 'erase' || (tool.id !== 'inspect' && !canStand(hover))) {
        ctx.fillStyle = 'rgba(224, 82, 82, .4)';
        ctx.fillRect(sx(hover.x), sy(hover.y), cam.cell, cam.cell);
      } else if (tool.id !== 'inspect' && !buildings.has(key(hover))) {
        if (tool.unit) {
          const longest = tool.unit.links.reduce((most, [, reach]) => Math.max(most, reach), 0);
          if (longest > 1) drawReach(hover, longest);
          if (tool.unit.route === 'tunnel') drawTunnelRange(hover, tool.unit.range);
        }
        ctx.globalAlpha = 0.5;
        drawBuilding({ x: hover.x, y: hover.y, z: hover.z, dir: rotation, kind: tool.kind }, tick);
        ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = 'rgba(255, 255, 255, .8)';
      ctx.lineWidth = 2;
      ctx.strokeRect(sx(hover.x) + 1, sy(hover.y) + 1, cam.cell - 2, cam.cell - 2);
    }
  }

  // The stock counters show only what buildings and research are paid in.
  const paidIn = new Set();
  for (const source of [...pack.belts, ...pack.units, ...pack.techs]) source.cost.forEach(([item]) => paidIn.add(item));
  const stockChips = [...paidIn].sort((a, b) => a - b).map((item) => {
    const chip = document.createElement('div');
    chip.className = 'chip stock';
    chip.title = pack.resources[item].name + ' in the shared stock';
    const value = document.createElement('b');
    value.textContent = '0';
    chip.append(icon(pack.resources[item].sprite, pack.resources[item].tint), value);
    $('hash').parentElement.before(chip);
    return { value, item, chip };
  });
  const REJECT_TEXT = {
    1: 'That tile is taken.',
    2: 'Drills and pumps need the right ground under them.',
    3: 'That needs research first.',
    4: 'Not enough in the shared stock. Deliver more to a depot.',
    5: 'Another research is already running.',
    6: 'That research needs an earlier one first.',
    7: 'That can’t be done.',
    8: 'There’s no level there.',
    9: 'Nothing on the level below is close enough to hold that up. Build a pillar.',
    10: 'Something on the level above is resting on that.',
  };

  function updateHud() {
    $('tick').textContent = of.of_tick().toLocaleString('en');
    const toHex = (n) => (n >>> 0).toString(16).padStart(8, '0');
    $('hash').textContent = toHex(of.of_hash_hi()) + toHex(of.of_hash_lo());
    refreshProgress();
    refreshAffordable();
    stockChips.forEach(({ value, item, chip }) => {
      const held = of.of_stock(item) >>> 0;
      value.textContent = held.toLocaleString('en');
      chip.hidden = held === 0;
    });
    refreshStats();
    refreshInspector();
    refreshResearch();
  }

  let previous = performance.now(), accumulated = 0, nextHud = 0;
  function frame(now) {
    accumulated += now - previous;
    previous = now;
    const steps = Math.min(Math.floor(accumulated / TICK_MS), MAX_STEPS_PER_FRAME);
    if (steps > 0) {
      accumulated = steps === MAX_STEPS_PER_FRAME ? 0 : accumulated - steps * TICK_MS;
      if (of.of_step(steps) > 0) say(REJECT_TEXT[of.of_last_reject()]);
    }
    readSnapshot();
    if (use3d) view3d.render({ ground, haze, buildings, items, cam, hover: pan ? null : hover, tool, rotation, selected, level, unsupported: !!hover && !canStand(hover) });
    else draw();
    if (now >= nextHud) { updateHud(); nextHud = now + 250; }
    requestAnimationFrame(frame);
  }
  say('Deliver items to a depot to pay for buildings and research.', 7000);
  if (new URLSearchParams(location.search).get('view') === '3d') toggle3d();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
