<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play OpenFactor</title>
<style>
  :root {
    --ink: #e8e6df; --dim: #9a9c9e; --ground: #15181c; --panel: #1f2329;
    --line: #363c45; --accent: #f2b63c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .bar { position: fixed; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px;
    align-items: center; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #hud { top: calc(12px + env(safe-area-inset-top, 0px)); }
  #tools { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); justify-content: center; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 9px; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .chip b { font-weight: 600; color: var(--ink); }
  .chip span { color: var(--dim); }
  a.chip { color: var(--ink); text-decoration: none; }
  .spacer { flex: 1; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 11px; cursor: pointer; min-height: 40px; }
  button:hover { border-color: var(--dim); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1b1608; font-weight: 600; }
  button kbd { font: 11px var(--mono); opacity: .6; margin-left: 5px; }
  #status { position: fixed; left: 50%; bottom: calc(112px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent);
    border-radius: 6px; padding: 6px 12px; max-width: calc(100% - 32px); }
  @media (max-width: 560px) { button kbd { display: none; } }
</style>
</head>
<body>
<canvas id="view" aria-label="Factory map"></canvas>

<div class="bar" id="hud">
  <a class="chip" href="../">&larr; Docs</a>
  <div class="chip"><span>tick</span> <b id="tick">0</b></div>
  <div class="chip"><span>ore</span> <b id="made0">0</b></div>
  <div class="chip"><span>plates</span> <b id="made1">0</b></div>
  <div class="chip"><span>widgets</span> <b id="made2">0</b></div>
  <div class="spacer"></div>
  <div class="chip" title="Hash of the full simulation state"><span>state</span> <b id="hash">-</b></div>
</div>

<div class="bar" id="tools" role="toolbar" aria-label="Build tools"></div>
<div id="status" role="status" hidden></div>

<script>
(async () => {
  const TICK_MS = 1000 / 60;
  const MAX_STEPS_PER_FRAME = 6;
  const TILE_UNITS = 256;
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const DIR_NAMES = ['↑', '→', '↓', '←'];
  const ITEM_COLORS = ['#c9744a', '#a9bccf', '#f2c14e'];
  const MACHINES = {
    1: { letter: 'M', color: '#5f7f52' },
    2: { letter: 'S', color: '#a2563a' },
    3: { letter: 'A', color: '#4f6fa3' },
    4: { letter: 'D', color: '#7a6191' },
  };
  const TOOLS = [
    { id: 'belt', kind: 0, label: 'Belt', key: '1' },
    { id: 'miner', kind: 1, label: 'Miner', key: '2' },
    { id: 'smelter', kind: 2, label: 'Smelter', key: '3' },
    { id: 'assembler', kind: 3, label: 'Assembler', key: '4' },
    { id: 'depot', kind: 4, label: 'Depot', key: '5' },
    { id: 'erase', label: 'Erase', key: 'X' },
    { id: 'move', label: 'Move', key: 'M' },
  ];

  const canvas = document.getElementById('view');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const $ = (id) => document.getElementById(id);
  const key = (c) => c.x + ',' + c.y;

  let statusTimer = 0;
  function say(text, ms = 2200) {
    statusEl.textContent = text;
    statusEl.hidden = false;
    clearTimeout(statusTimer);
    if (ms) statusTimer = setTimeout(() => { statusEl.hidden = true; }, ms);
  }

  let of;
  try {
    const source = await fetch('openfactor.wasm');
    if (!source.ok) throw new Error('HTTP ' + source.status);
    const { instance } = await WebAssembly.instantiate(await source.arrayBuffer(), {});
    of = instance.exports;
  } catch (error) {
    say('The simulation could not load (' + error.message + '). Try reloading the page.', 0);
    return;
  }

  let tool = TOOLS[0];
  let rotation = 1;
  let cam = { x: 11, y: 5, cell: 40 };
  let width = 0, height = 0;
  let resources = new Map(), buildings = new Map(), items = [];
  let hover = null, drag = null, pan = null;

  // Toolbar
  const toolbar = $('tools');
  const buttons = new Map();
  for (const t of TOOLS) {
    const b = document.createElement('button');
    b.innerHTML = t.label + '<kbd>' + t.key + '</kbd>';
    b.addEventListener('click', () => selectTool(t));
    toolbar.append(b);
    buttons.set(t, b);
  }
  const rotateButton = document.createElement('button');
  rotateButton.addEventListener('click', () => rotate());
  toolbar.append(rotateButton);
  const resetButton = document.createElement('button');
  resetButton.textContent = 'Reset';
  let resetArmed = 0;
  resetButton.addEventListener('click', () => {
    if (resetArmed) {
      clearTimeout(resetArmed); resetArmed = 0;
      resetButton.textContent = 'Reset';
      of.of_reset();
      return;
    }
    resetButton.textContent = 'Really reset?';
    resetArmed = setTimeout(() => { resetArmed = 0; resetButton.textContent = 'Reset'; }, 3000);
  });
  toolbar.append(resetButton);

  function selectTool(t) {
    tool = t;
    for (const [other, b] of buttons) b.setAttribute('aria-pressed', other === t);
  }
  function showRotation() { rotateButton.innerHTML = 'Facing ' + DIR_NAMES[rotation] + '<kbd>R</kbd>'; }
  function rotate() { rotation = (rotation + 1) % 4; showRotation(); }
  selectTool(tool);
  showRotation();

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const cellAt = (e) => ({
    x: Math.floor(cam.x + (e.clientX - width / 2) / cam.cell),
    y: Math.floor(cam.y + (e.clientY - height / 2) / cam.cell),
  });

  function applyAt(cell) {
    const k = key(cell);
    if (drag.touched.has(k)) return;
    const occupied = buildings.has(k);
    if (tool.id === 'erase') {
      if (occupied) { of.of_remove(cell.x, cell.y); drag.touched.add(k); }
    } else if (!occupied) {
      of.of_place(cell.x, cell.y, rotation, tool.kind);
      drag.touched.add(k);
    }
  }

  // Dragging a belt steers it: each laid tile turns to point at the next.
  function dragTo(cell) {
    while (drag.last.x !== cell.x || drag.last.y !== cell.y) {
      const dx = Math.sign(cell.x - drag.last.x), dy = dx ? 0 : Math.sign(cell.y - drag.last.y);
      const next = { x: drag.last.x + dx, y: drag.last.y + dy };
      if (tool.id === 'belt') {
        rotation = DIRS.findIndex(([x, y]) => x === dx && y === dy);
        showRotation();
        if (drag.touched.has(key(drag.last))) {
          of.of_remove(drag.last.x, drag.last.y);
          of.of_place(drag.last.x, drag.last.y, rotation, tool.kind);
        }
      }
      drag.last = next;
      applyAt(next);
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    if (e.button !== 0 || tool.id === 'move') {
      pan = { x: e.clientX, y: e.clientY, camX: cam.x, camY: cam.y };
      return;
    }
    const cell = cellAt(e);
    drag = { last: cell, touched: new Set() };
    applyAt(cell);
  });
  canvas.addEventListener('pointermove', (e) => {
    hover = cellAt(e);
    if (pan) {
      cam.x = pan.camX - (e.clientX - pan.x) / cam.cell;
      cam.y = pan.camY - (e.clientY - pan.y) / cam.cell;
    } else if (drag) {
      dragTo(hover);
    }
  });
  const endPointer = () => { drag = null; pan = null; };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', () => { hover = null; });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.cell = Math.min(96, Math.max(14, cam.cell * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    const lower = e.key.toLowerCase();
    if (lower === 'r') return rotate();
    const t = TOOLS.find((x) => x.key.toLowerCase() === lower);
    if (t) return selectTool(t);
    const panStep = 2;
    const moves = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
    if (moves[lower]) {
      e.preventDefault();
      cam.x += moves[lower][0] * panStep;
      cam.y += moves[lower][1] * panStep;
    }
  });

  function readSnapshot() {
    const pointer = of.of_snapshot();
    const data = new Int32Array(of.memory.buffer, pointer, of.of_snapshot_len());
    let i = 0;
    resources = new Map();
    for (let n = data[i++]; n > 0; n--, i += 3) resources.set(data[i] + ',' + data[i + 1], data[i + 2]);
    buildings = new Map();
    for (let n = data[i++]; n > 0; n--, i += 4) {
      buildings.set(data[i] + ',' + data[i + 1], { x: data[i], y: data[i + 1], dir: data[i + 2], kind: data[i + 3] });
    }
    items = [];
    for (let n = data[i++]; n > 0; n--, i += 5) {
      const along = data[i + 3] / TILE_UNITS - 0.5, [dx, dy] = DIRS[data[i + 2]];
      items.push({ x: data[i] + 0.5 + dx * along, y: data[i + 1] + 0.5 + dy * along, item: data[i + 4] });
    }
  }

  const sx = (x) => (x - cam.x) * cam.cell + width / 2;
  const sy = (y) => (y - cam.y) * cam.cell + height / 2;

  function drawBuilding(b, tick) {
    const size = cam.cell;
    ctx.save();
    ctx.translate(sx(b.x + 0.5), sy(b.y + 0.5));
    ctx.scale(size, size);
    if (b.kind === 0) {
      ctx.rotate((b.dir - 1) * Math.PI / 2);
      ctx.fillStyle = '#343a44';
      ctx.fillRect(-0.5, -0.42, 1, 0.84);
      ctx.strokeStyle = '#59616e';
      ctx.lineWidth = 0.06;
      const phase = ((tick * 16 / TILE_UNITS) % 0.5);
      for (let c = -0.5 + phase; c < 0.5; c += 0.5) {
        ctx.beginPath();
        ctx.moveTo(c - 0.1, -0.2); ctx.lineTo(c + 0.1, 0); ctx.lineTo(c - 0.1, 0.2);
        ctx.stroke();
      }
    } else {
      const machine = MACHINES[b.kind];
      ctx.fillStyle = machine.color;
      ctx.fillRect(-0.44, -0.44, 0.88, 0.88);
      ctx.fillStyle = '#f4f1e8';
      ctx.font = '600 0.42px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(machine.letter, 0, 0.02);
      if (b.kind !== 4) {
        ctx.rotate((b.dir - 1) * Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0.3, -0.13); ctx.lineTo(0.44, 0); ctx.lineTo(0.3, 0.13);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function draw() {
    const tick = of.of_tick();
    ctx.fillStyle = '#15181c';
    ctx.fillRect(0, 0, width, height);

    const left = Math.floor(cam.x - width / 2 / cam.cell) - 1, right = Math.ceil(cam.x + width / 2 / cam.cell) + 1;
    const top = Math.floor(cam.y - height / 2 / cam.cell) - 1, bottom = Math.ceil(cam.y + height / 2 / cam.cell) + 1;
    const visible = (x, y) => x >= left && x <= right && y >= top && y <= bottom;

    ctx.strokeStyle = '#21262d';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = left; x <= right; x++) { ctx.moveTo(sx(x), 0); ctx.lineTo(sx(x), height); }
    for (let y = top; y <= bottom; y++) { ctx.moveTo(0, sy(y)); ctx.lineTo(width, sy(y)); }
    ctx.stroke();

    ctx.fillStyle = '#4a3226';
    for (const k of resources.keys()) {
      const [x, y] = k.split(',').map(Number);
      if (visible(x, y)) ctx.fillRect(sx(x), sy(y), cam.cell, cam.cell);
    }
    for (const b of buildings.values()) if (visible(b.x, b.y)) drawBuilding(b, tick);
    for (const it of items) {
      if (!visible(it.x, it.y)) continue;
      ctx.fillStyle = ITEM_COLORS[it.item] || '#fff';
      ctx.beginPath();
      ctx.arc(sx(it.x), sy(it.y), cam.cell * 0.13, 0, Math.PI * 2);
      ctx.fill();
    }

    if (hover && !pan && tool.id !== 'move') {
      if (tool.id === 'erase') {
        ctx.fillStyle = 'rgba(224, 82, 82, .4)';
        ctx.fillRect(sx(hover.x), sy(hover.y), cam.cell, cam.cell);
      } else if (!buildings.has(key(hover))) {
        ctx.globalAlpha = 0.5;
        drawBuilding({ x: hover.x, y: hover.y, dir: rotation, kind: tool.kind }, tick);
        ctx.globalAlpha = 1;
      }
    }
  }

  function updateHud() {
    $('tick').textContent = of.of_tick().toLocaleString('en');
    for (let i = 0; i < 3; i++) $('made' + i).textContent = (of.of_produced(i) >>> 0).toLocaleString('en');
    const hex = (n) => (n >>> 0).toString(16).padStart(8, '0');
    $('hash').textContent = hex(of.of_hash_hi()) + hex(of.of_hash_lo());
  }

  let previous = performance.now(), accumulated = 0, nextHud = 0;
  function frame(now) {
    accumulated += now - previous;
    previous = now;
    const steps = Math.min(Math.floor(accumulated / TICK_MS), MAX_STEPS_PER_FRAME);
    if (steps > 0) {
      accumulated = steps === MAX_STEPS_PER_FRAME ? 0 : accumulated - steps * TICK_MS;
      if (of.of_step(steps) > 0) say('Can’t build there. Miners need ore, and tiles must be empty.');
    }
    readSnapshot();
    draw();
    if (now >= nextHud) { updateHud(); nextHud = now + 500; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
