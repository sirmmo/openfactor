[workspace]
members = ["crates/sim", "crates/client-wasm"]
resolver = "2"

[profile.release]
debug = 1

# The replay tests hash the whole world every tick. Overflow checks stay on.
[profile.test]
opt-level = 2

# cargo build --profile wasm --target wasm32-unknown-unknown -p openfactor-client-wasm
[profile.wasm]
inherits = "release"
debug = 0
lto = true
codegen-units = 1
panic = "abort"
strip = true
